plugins {
    id 'com.android.application'
    id 'androidx.room'
}

def resolveCanonicalRepositoryRoot = {
    try {
        def output = new ByteArrayOutputStream()
        def result = exec {
            workingDir rootProject.projectDir
            commandLine 'git', 'rev-parse', '--git-common-dir'
            standardOutput = output
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        if (result.exitValue == 0) {
            def commonDirectory = new File(output.toString('UTF-8').trim())
            if (!commonDirectory.isAbsolute()) {
                commonDirectory = new File(rootProject.projectDir, commonDirectory.path)
            }
            commonDirectory = commonDirectory.canonicalFile
            if (commonDirectory.name == '.git') {
                return commonDirectory.parentFile
            }
        }
    } catch (Exception ignored) {
        // Source archives and some CI environments do not expose Git metadata.
    }
    return rootProject.projectDir.canonicalFile
}

def configuredDebugKeystore = System.getenv('SHIQI_DEBUG_KEYSTORE')
def canonicalRepositoryRoot = resolveCanonicalRepositoryRoot()
def legacyRepositoryDebugKeystore =
        new File(canonicalRepositoryRoot, 'apk/debug.keystore')
def stableUserDebugKeystore = new File(
        System.getProperty('user.home'), '.shiqi-expiry-tracker/signing/debug.keystore'
)
def localDebugKeystore = configuredDebugKeystore
        ? file(configuredDebugKeystore).canonicalFile
        : stableUserDebugKeystore

android {
    namespace 'com.shiqi.expirytracker'

    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    buildToolsVersion '36.1.0'

    signingConfigs {
        debug {
            storeFile localDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.shiqi.expirytracker'
        minSdk 24
        targetSdk 35
        versionCode 38
        versionName '0.4.8'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    def camerax_version = '1.6.1'
    def activity_version = '1.13.0'
    def room_version = '2.8.4'

    implementation files('libs/zxing-core-3.5.3.jar')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'
    implementation "androidx.activity:activity:${activity_version}"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'org.opencv:opencv:4.13.0'
    implementation "androidx.room:room-runtime:${room_version}"
    annotationProcessor "androidx.room:room-compiler:${room_version}"

    androidTestImplementation "androidx.room:room-testing:${room_version}"
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

tasks.register('ensureLocalDebugKeystore') {
    outputs.file(localDebugKeystore)

    doLast {
        if (localDebugKeystore.exists()) {
            return
        }

        localDebugKeystore.parentFile.mkdirs()
        if (!configuredDebugKeystore && legacyRepositoryDebugKeystore.exists()) {
            java.nio.file.Files.copy(
                    legacyRepositoryDebugKeystore.toPath(), localDebugKeystore.toPath()
            )
            return
        }
        def keytoolName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'keytool.exe' : 'keytool'
        exec {
            executable new File(System.getProperty('java.home'), "bin/${keytoolName}").absolutePath
            args(
                '-genkeypair',
                '-keystore', localDebugKeystore.absolutePath,
                '-storepass', 'android',
                '-keypass', 'android',
                '-alias', 'androiddebugkey',
                '-dname', 'CN=Android Debug,O=Android,C=US',
                '-keyalg', 'RSA',
                '-keysize', '2048',
                '-validity', '10000'
            )
        }
    }
}

afterEvaluate {
    tasks.matching {
        it.name == 'validateSigningDebug'
                || it.name == 'validateSigningDebugAndroidTest'
                || it.name == 'packageDebugAndroidTest'
    }.configureEach {
        dependsOn tasks.named('ensureLocalDebugKeystore')
    }
}
